<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drawing motion review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:14px Arial,Helvetica,sans-serif}#viewer{height:100dvh;display:flex;flex-direction:column}body.scroll-mode{min-height:400dvh}body.scroll-mode #viewer{position:sticky;top:0}main{flex:1;min-height:0;overflow:hidden;padding:12px}#drawing,svg{display:block;width:100%;height:100%}footer{min-height:76px;flex-wrap:wrap;display:flex;align-items:center;gap:16px;padding:16px;border-top:1px solid #ddd}a{color:inherit;padding:10px;min-height:44px}button,select{min-height:44px;font:inherit;padding:8px;background:white;color:inherit;border:1px solid #777;border-radius:3px}input[type=range]{min-width:60px;flex:1;accent-color:#333}.scroll-control{display:flex;align-items:center;gap:4px;white-space:nowrap}output{white-space:nowrap;font-variant-numeric:tabular-nums}@media(max-width:700px){footer{gap:8px;padding:10px}select{max-width:120px}output{font-size:11px}}
</style></head><body><div id="viewer"><main><div id="drawing" aria-label="Animated CAD drawing"></div></main><footer><a id="read" href="./reading.html">Read drawing</a><label for="part">Part</label><select id="part"></select><button id="play" type="button" disabled>Play</button><label class="scroll-control"><input id="scroll-mode" type="checkbox"> Scroll</label><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Drawing progress"><output id="status" aria-live="off">Loading</output></footer></div><script type="module" src="./player.mjs"></script></body></html>
