<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>머그</title><style>
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#fff}
#story{height:280vh}.stage{position:sticky;top:0;width:100%;height:100vh;overflow:hidden}
#viewer{position:absolute;inset:0;opacity:0}#viewer canvas{display:block}
#sheet{position:absolute;inset:0;display:grid;place-items:center}
#sheet img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto}
#front{position:absolute;opacity:0;pointer-events:none;transform-origin:center center}
#front img{display:block;width:100%;height:100%}
</style><link rel="stylesheet" href="./gallery.css"><style id="jomul-cad-loading">#sheet-image:not([data-loaded]){visibility:hidden}</style><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64"><link rel="icon" type="image/png" sizes="192x192" href="/favicon.png"></head><body>
<section id="story"><div class="stage">
<div id="viewer" role="img" aria-label="CAD to wire, clay and glaze review"></div>
<div id="sheet"><img id="sheet-image" alt="머그 기술 도면"></div>
<div id="front" aria-hidden="true"><img src="./front-view.svg" alt=""></div>
</div></section>
<section class="gallery" id="gallery" aria-label="사진 갤러리"><div class="gallery-first"><button class="gallery-photo gallery-photo--scatter" style="--d-x:62.6277%;--d-y:16.6342%;--d-w:21.1457%;--d-h:39.3138%;--m-x:52.3632%;--m-y:11.6721%;--m-w:19.8653%;--m-h:50.1722%" type="button" aria-label="사진 확대"><img src="./assets/photo-1.webp" alt="머그 초벌 과정 사진 — 완성 유약 사진 아님"></button><button class="gallery-photo gallery-photo--scatter" style="--d-x:9.0356%;--d-y:32.9976%;--d-w:39.3697%;--d-h:53.1592%;--m-x:7.0066%;--m-y:38.6212%;--m-w:40.4262%;--m-h:48.9317%" type="button" aria-label="사진 확대"><img src="./assets/photo-2.webp" alt="나무 테이블 위 두 머그컵"></button></div></section><dialog class="photo-lightbox" id="photo-lightbox" aria-label="사진 확대 보기"><button class="lightbox-close" type="button" aria-label="확대 사진 닫기"></button><img alt=""></dialog>
<script>
(() => {
  const image = document.getElementById('sheet-image');
  const reveal = () => { if (image.naturalWidth) image.dataset.loaded = ''; };
  image.addEventListener('load', reveal);
  if (image.complete) reveal();
})();
</script>
<script type="module" src="./viewer.js"></script><script type="module" src="/project-photo-dialog.mjs"></script></body></html>
