<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mug / provisional handle review</title><style>
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#fff}
#story{height:280vh}.stage{position:sticky;top:0;width:100%;height:100vh;overflow:hidden}
#viewer{position:absolute;inset:0;opacity:0}#viewer canvas{display:block}
#sheet{position:absolute;inset:0;display:grid;place-items:center}
#sheet img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto}
#front{position:absolute;opacity:0;pointer-events:none;transform-origin:center center}
#front img{display:block;width:100%;height:100%}
</style><link rel="stylesheet" href="./gallery.css"></head><body>
<section id="story"><div class="stage">
<div id="viewer" role="img" aria-label="CAD to wire, clay and glaze review"></div>
<div id="sheet"><img id="sheet-image" alt="머그 임시 기술 CAD 시트"></div>
<div id="front" aria-hidden="true"><img src="./front-view.svg" alt=""></div>
</div></section>
<section class="gallery" id="gallery" aria-label="사진 갤러리"><div class="gallery-first"><button class="gallery-photo gallery-photo--hero" type="button" aria-label="사진 확대"><img src="./assets/photo-1.webp" alt="머그 초벌 과정 사진 — 완성 유약 사진 아님"></button></div></section><dialog class="photo-lightbox" id="photo-lightbox" aria-label="사진 확대 보기"><button class="lightbox-close" type="button" aria-label="확대 사진 닫기"></button><img alt=""></dialog>
<script type="module" src="./viewer.js"></script></body></html>
