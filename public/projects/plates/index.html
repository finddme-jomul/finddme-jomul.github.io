<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>접시</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#fff;color:#383634;font:16px system-ui,sans-serif;transition:color .2s}
#story{height:840vh}.stage{height:100vh;position:sticky;top:0;overflow:hidden}
#viewer{position:absolute;inset:0}#viewer canvas{display:block}
.cad-sheet{position:absolute;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none}
.cad-sheet img{position:absolute;left:50%;top:50%;display:block;width:max(100vw,141.306vh);height:auto;max-width:none;max-height:none;transform:translate(-50%,-50%)}
.cad-main{position:absolute;z-index:1;pointer-events:none;opacity:0;transform-origin:center center;will-change:transform,opacity}
.cad-main img{display:block;width:100%;height:100%}
#story{position:relative;z-index:0}
@media(max-width:700px){.cad-sheet img{left:calc(50% + 25.4vh)}}
.cad-sheet img{left:50%;top:50%;width:100%;height:100%;object-fit:contain;transform:translate(-50%,-50%)}
</style><link rel="stylesheet" href="./gallery.css"></head>
<body><section id="story"><div class="stage">
<div id="viewer" role="img" aria-label="Three plates / reviewed dimensions 가정 CAD에서 3D 선, 흙, 유약 완료 예상 모습으로 변하는 스크롤 시안"></div>
<div class="cad-sheet" id="cad-sheet"><img id="cad-sheet-image" src="./assets/sheet-desktop.svg" alt="CAD technical drawing"></div>
<div class="cad-main" data-part="plate-large" aria-hidden="true"><img src="./assets/plate-large/front-view.svg" alt=""></div><div class="cad-main" data-part="plate-medium" aria-hidden="true"><img src="./assets/plate-medium/front-view.svg" alt=""></div><div class="cad-main" data-part="plate-small" aria-hidden="true"><img src="./assets/plate-small/front-view.svg" alt=""></div>
</div></section>
<section class="gallery" id="gallery" aria-label="사진 갤러리"><div class="gallery-first"><button class="gallery-photo gallery-photo--hero" type="button" aria-label="사진 확대"><img src="./assets/photo-1.webp" alt="초벌 공정 사진: 왼쪽 겹친 접시 중 맨 아래를 제외한 세 접시; 최종 유약 색상 사진 아님"></button></div></section><dialog class="photo-lightbox" id="photo-lightbox" aria-label="사진 확대 보기"><button class="lightbox-close" type="button" aria-label="확대 사진 닫기"></button><img alt=""></dialog><script type="module" src="./viewer.js"></script></body></html>
